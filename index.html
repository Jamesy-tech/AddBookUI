
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add BookUI</title>

    <link rel="icon" href="icon3.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Nunito';
            background: black;
            color: white;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;
        }

        .install_bookui {
            background: dodgerblue;
            color: white;
            font-family: 'Nunito';
            text-decoration: none;

            padding: 25px;
            width:250px;
            text-align:center;
            margin:8px;
            font-size:20px;
            margin-bottom: 67px;

            border-radius: 12px;
        }

        .title {
            color: white;
            font-size:36px;
            padding:0px;
            display:block;
            font-weight:600;
        }

        .desc {
            color:white;
            font-size:18px;
            padding:10px;
            padding-bottom:10px;
            display:block;
        }

    </style>
</head>

<body>

    <span class="title">Add BookUI</span>

    <span class="desc">Drag to your bookmarks bar</span>

    <a
        class="install_bookui"
        id="installBookUI"
        href="#"
    >
        BookUI
    </a>

    <script>
        fetch('https://raw.githubusercontent.com/Jamesy-tech/BookUI/refs/heads/main/bookmarklet-code.js')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to fetch bookmarklet');
                }

                return response.text();
            })
            .then(code => {
                document.getElementById('installBookUI').href = code.trim();
            })
            .catch(error => {
                console.error('Failed to load BookUI:', error);
            });
    </script>

</body>
</html>
